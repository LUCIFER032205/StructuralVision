name: structural_vision_ar
description: Building inspection - crack detection with AR overlay
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  supabase_flutter: ^2.8.0
  camera: ^0.11.0
  http: ^1.2.0
  # Vendored 0.0.3 with a patch, see third_party/ar_flutter_plugin_2/PATCHES.md
  ar_flutter_plugin_2:
    path: third_party/ar_flutter_plugin_2
  vector_math: ^2.1.4
  printing: ^5.14.3
  image_picker: ^1.1.2
  shared_preferences: ^2.3.0
  file_picker: ^11.0.3
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
