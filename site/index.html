<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>StructuralVision</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         background: #0D1117; color: #E6EDF3;
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 420px; padding: 32px 24px; text-align: center; }
  .icon { width: 64px; height: 64px; margin: 0 auto 20px; border-radius: 50%;
          display: grid; place-items: center; background: #161B22; }
  h1 { font-size: 24px; margin: 0 0 8px; }
  p { color: #8B949E; margin: 0 0 12px; }
  .brand { margin-top: 32px; color: #FBBF24; font-weight: 600; letter-spacing: .02em; }
</style>
</head>
<body>
<main>
  <div class="icon" id="icon" aria-hidden="true">
    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#34D399"
         stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
  </div>
  <h1 id="title">Email confirmed</h1>
  <p id="msg">Your account is ready. Go back to the StructuralVision app and sign in.</p>
  <p>You can close this page.</p>
  <div class="brand">StructuralVision</div>
</main>
<script>
  // Supabase lands here with tokens or an error in the URL fragment. Show the
  // error if there is one, then strip the fragment so tokens don't linger.
  // PKCE flow puts it in the query string instead, so read both.
  var h = new URLSearchParams(location.hash.slice(1) + '&' + location.search.slice(1));
  if (h.get('error')) {
    document.getElementById('title').textContent = 'Link not valid';
    document.getElementById('msg').textContent =
      (h.get('error_description') || 'This confirmation link did not work.') +
      ' Sign up again in the app to get a new link.';
    document.getElementById('icon').innerHTML =
      '<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#F43F5E" stroke-width="2.5" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>';
  }
  if (location.hash || location.search) history.replaceState(null, '', location.pathname);
</script>
</body>
</html>
